<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Happy Girlfriend's Day 💖</title>
<meta name="description" content="A tiny question with only one right answer." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink-1: #ffe3ef;
    --pink-2: #ffd0e4;
    --pink-3: #ff8fbf;
    --rose: #ff4f8b;
    --rose-deep: #d81e64;
    --ink: #4a1330;
    --card: rgba(255, 255, 255, 0.72);
    --shadow: 0 24px 60px rgba(216, 30, 100, 0.18);
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 800px at 15% 10%, #fff6fa 0%, transparent 60%),
      radial-gradient(900px 700px at 85% 90%, #ffe0ef 0%, transparent 55%),
      linear-gradient(160deg, var(--pink-1), var(--pink-2) 45%, #ffc2dd 100%);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 40;
  }

  .hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }

  .heart {
    position: absolute;
    bottom: -8vh;
    font-size: 28px;
    opacity: 0;
    animation: rise linear forwards;
    will-change: transform, opacity;
  }

  @keyframes rise {
    0%   { transform: translate3d(0, 0, 0) rotate(0deg) scale(0.6); opacity: 0; }
    12%  { opacity: var(--peak, 0.85); }
    100% { transform: translate3d(var(--drift, 0px), -112vh, 0) rotate(var(--spin, 40deg)) scale(1); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 10;
    min-height: 100%;
    display: grid;
    place-items: center;
    padding: 24px 18px;
  }

  .card {
    width: min(680px, 100%);
    padding: clamp(28px, 5vw, 52px) clamp(22px, 5vw, 48px);
    text-align: center;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.9);
    border-radius: 32px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    animation: pop 0.7s cubic-bezier(0.22, 1.2, 0.36, 1) both;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(22px) scale(0.94); }
    to   { opacity: 1; transform: none; }
  }

  .kicker {
    margin: 0 0 10px;
    font-family: "Caveat", cursive;
    font-size: clamp(22px, 4.6vw, 30px);
    letter-spacing: 0.4px;
    color: var(--rose-deep);
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 6.4vw, 46px);
    font-weight: 600;
    line-height: 1.18;
    letter-spacing: -0.4px;
  }

  h1 .accent {
    display: block;
    margin-top: 6px;
    color: var(--rose-deep);
    font-weight: 700;
  }

  .hint {
    margin: 14px 0 0;
    min-height: 1.6em;
    font-size: clamp(15px, 3.4vw, 18px);
    color: #8a4a68;
    transition: opacity 0.18s ease;
  }

  .buttons {
    margin-top: clamp(26px, 5vw, 38px);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    align-items: center;
  }

  .btn {
    font: inherit;
    font-weight: 600;
    font-size: clamp(17px, 3.6vw, 21px);
    padding: 15px 34px;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.18s cubic-bezier(0.22, 1.2, 0.36, 1), box-shadow 0.18s ease, background 0.2s ease;
    touch-action: manipulation;
  }

  .btn:focus-visible {
    outline: 3px solid var(--rose-deep);
    outline-offset: 3px;
  }

  .yes {
    color: #fff;
    background: linear-gradient(135deg, var(--rose), #ff7aa8);
    box-shadow: 0 14px 30px rgba(255, 79, 139, 0.42);
    transform: scale(var(--grow, 1));
    transform-origin: center;
  }

  .yes:hover { box-shadow: 0 18px 40px rgba(255, 79, 139, 0.55); }
  .yes:active { transform: scale(calc(var(--grow, 1) * 0.96)); }

  .no {
    color: var(--rose-deep);
    background: #fff;
    box-shadow: 0 8px 22px rgba(216, 30, 100, 0.16);
    transform: scale(var(--shrink, 1));
  }

  .no.loose {
    position: fixed;
    z-index: 30;
    margin: 0;
    transition: left 0.22s cubic-bezier(0.22, 1.2, 0.36, 1),
                top 0.22s cubic-bezier(0.22, 1.2, 0.36, 1),
                transform 0.22s ease;
  }

  #reveal[hidden] { display: none; }

  .big-heart {
    font-size: clamp(58px, 13vw, 92px);
    line-height: 1;
    animation: beat 1.15s ease-in-out infinite;
  }

  @keyframes beat {
    0%, 100% { transform: scale(1); }
    18% { transform: scale(1.16); }
    36% { transform: scale(0.98); }
    54% { transform: scale(1.1); }
  }

  .letter {
    margin: 18px auto 0;
    max-width: 44ch;
    font-family: "Caveat", cursive;
    font-size: clamp(21px, 4.6vw, 28px);
    line-height: 1.5;
    color: #6b1e42;
    white-space: pre-line;
  }

  .signoff {
    margin: 22px 0 0;
    font-family: "Caveat", cursive;
    font-size: clamp(20px, 4.2vw, 26px);
    color: var(--rose-deep);
  }

  .photo {
    display: block;
    width: min(240px, 62vw);
    aspect-ratio: 1 / 1;
    margin: 20px auto 0;
    object-fit: cover;
    border-radius: 24px;
    border: 5px solid #fff;
    box-shadow: var(--shadow);
    rotate: -2deg;
  }

  .replay {
    margin-top: 26px;
    padding: 10px 22px;
    font: inherit;
    font-size: 15px;
    color: var(--rose-deep);
    background: rgba(255, 255, 255, 0.75);
    border: 1px solid rgba(216, 30, 100, 0.22);
    border-radius: 999px;
    cursor: pointer;
  }

  .replay:hover { background: #fff; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="hearts" id="hearts" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>

<main class="stage">
  <section class="card" id="ask">
    <p class="kicker" id="kicker">Happy Girlfriend's Day 🌷</p>
    <h1>Hey <span id="askName">babe</span>…<span class="accent" id="question">do you love me?</span></h1>
    <p class="hint" id="hint">Take your time. (There's no wrong answer… well, one.)</p>

    <div class="buttons">
      <button class="btn yes" id="yes" type="button">Yes 💖</button>
      <button class="btn no" id="no" type="button">No</button>
    </div>
  </section>

  <section class="card" id="reveal" hidden>
    <div class="big-heart" aria-hidden="true">💗</div>
    <p class="kicker" id="revealKicker">I knew it.</p>
    <h1 id="revealTitle">I love you too <span class="accent" id="revealName">babe</span></h1>
    <img class="photo" id="photo" alt="us" hidden />
    <p class="letter" id="letter"></p>
    <p class="signoff" id="signoff"></p>
    <button class="replay" id="replay" type="button">ask me again 🔁</button>
  </section>
</main>

<script>
const CONFIG = {
  herName: "babe",
  question: "do you love me?",
  message:
    "Happy Girlfriend's Day to the girl who makes ordinary days feel like a celebration.\n\n" +
    "Thank you for your laugh, your patience, and the way you make everything lighter just by being there.\n\n" +
    "You're my favourite person, my favourite place, and my favourite plan.",
  signoff: "Forever yours 💌",
  photoUrl: "chiwaks/us.jpg",
  noLabels: [
    "No",
    "Are you sure?",
    "Think again 🥺",
    "Wrong button!",
    "Nope, try Yes",
    "You can't catch me",
    "Still no? 😢",
    "This one's broken",
    "Last chance…",
    "Okay this is rude 😭",
    "Yes is right there →",
  ],
  taunts: [
    "Take your time. (There's no wrong answer… well, one.)",
    "Hmm. Suspicious.",
    "That button is a little slippery, huh?",
    "It's genuinely not going to let you.",
    "The Yes button is feeling very confident right now.",
    "My heart cannot take this 💔",
    "You're really committed to this bit.",
    "Fine. It's faster than you.",
    "I'll wait. I've got all day.",
    "Okay, plot twist: there's only one button.",
  ],
};

const ask = document.getElementById("ask");
const reveal = document.getElementById("reveal");
const yesBtn = document.getElementById("yes");
const noBtn = document.getElementById("no");
const hint = document.getElementById("hint");
const heartsLayer = document.getElementById("hearts");
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");

document.getElementById("askName").textContent = CONFIG.herName;
document.getElementById("question").textContent = CONFIG.question;
document.getElementById("revealName").textContent = CONFIG.herName;
document.getElementById("letter").textContent = CONFIG.message;
document.getElementById("signoff").textContent = CONFIG.signoff;
hint.textContent = CONFIG.taunts[0];

if (CONFIG.photoUrl) {
  const photo = document.getElementById("photo");
  photo.src = CONFIG.photoUrl;
  photo.hidden = false;
}

let dodges = 0;
let answered = false;
const pointer = { x: -9999, y: -9999 };

function setLoose() {
  if (noBtn.classList.contains("loose")) return;
  const rect = noBtn.getBoundingClientRect();
  noBtn.style.width = rect.width + "px";
  noBtn.style.height = rect.height + "px";
  noBtn.style.left = rect.left + "px";
  noBtn.style.top = rect.top + "px";
  noBtn.classList.add("loose");
}

function overlapsYes(x, y, w, h) {
  const r = yesBtn.getBoundingClientRect();
  const pad = 28;
  return x < r.right + pad && x + w > r.left - pad && y < r.bottom + pad && y + h > r.top - pad;
}

function dodge() {
  setLoose();
  dodges++;

  const w = noBtn.offsetWidth;
  const h = noBtn.offsetHeight;
  const pad = 14;
  const maxX = Math.max(pad, window.innerWidth - w - pad);
  const maxY = Math.max(pad, window.innerHeight - h - pad);
  const current = noBtn.getBoundingClientRect();

  let x = current.left;
  let y = current.top;

  for (let i = 0; i < 40; i++) {
    const nx = pad + Math.random() * (maxX - pad);
    const ny = pad + Math.random() * (maxY - pad);
    const fromPointer = Math.hypot(nx + w / 2 - pointer.x, ny + h / 2 - pointer.y);
    const fromCurrent = Math.hypot(nx - current.left, ny - current.top);
    if (fromPointer > 160 && fromCurrent > 120 && !overlapsYes(nx, ny, w, h)) {
      x = nx; y = ny; break;
    }
    if (i === 39) { x = nx; y = ny; }
  }

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
  noBtn.style.setProperty("--shrink", Math.max(0.62, 1 - dodges * 0.035));
  noBtn.textContent = CONFIG.noLabels[Math.min(dodges, CONFIG.noLabels.length - 1)];

  yesBtn.style.setProperty("--grow", Math.min(1.9, 1 + dodges * 0.09));
  hint.textContent = CONFIG.taunts[Math.min(dodges, CONFIG.taunts.length - 1)];
}

document.addEventListener("pointermove", (e) => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  if (answered || !noBtn.isConnected) return;
  const r = noBtn.getBoundingClientRect();
  const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
  const dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
  if (Math.hypot(dx, dy) < 70) dodge();
}, { passive: true });

noBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(); });
noBtn.addEventListener("click", (e) => { e.preventDefault(); dodge(); });
noBtn.addEventListener("focus", dodge);

window.addEventListener("resize", () => {
  if (!noBtn.classList.contains("loose")) return;
  const r = noBtn.getBoundingClientRect();
  noBtn.style.left = Math.min(r.left, window.innerWidth - r.width - 14) + "px";
  noBtn.style.top = Math.min(r.top, window.innerHeight - r.height - 14) + "px";
});

yesBtn.addEventListener("click", () => {
  if (answered) return;
  answered = true;
  ask.hidden = true;
  reveal.hidden = false;
  heartRate = 220;
  burst(160);
  setTimeout(() => burst(90), 450);
  setTimeout(() => burst(70), 950);
});

document.getElementById("replay").addEventListener("click", () => {
  answered = false;
  dodges = 0;
  heartRate = 700;
  reveal.hidden = true;
  ask.hidden = false;
  noBtn.className = "btn no";
  noBtn.removeAttribute("style");
  noBtn.textContent = CONFIG.noLabels[0];
  yesBtn.style.setProperty("--grow", 1);
  hint.textContent = CONFIG.taunts[0];
});

const HEART_GLYPHS = ["💖", "💕", "💗", "🩷", "❤️", "🌸", "💞"];
let heartRate = 700;

function spawnHeart() {
  const el = document.createElement("span");
  el.className = "heart";
  el.textContent = HEART_GLYPHS[(Math.random() * HEART_GLYPHS.length) | 0];
  el.style.left = Math.random() * 100 + "vw";
  el.style.fontSize = 16 + Math.random() * 26 + "px";
  el.style.setProperty("--drift", (Math.random() * 160 - 80).toFixed(0) + "px");
  el.style.setProperty("--spin", (Math.random() * 120 - 60).toFixed(0) + "deg");
  el.style.setProperty("--peak", (0.45 + Math.random() * 0.45).toFixed(2));
  const life = 7000 + Math.random() * 6000;
  el.style.animationDuration = life + "ms";
  heartsLayer.appendChild(el);
  setTimeout(() => el.remove(), life + 200);
}

(function heartLoop() {
  spawnHeart();
  setTimeout(heartLoop, heartRate * (0.6 + Math.random() * 0.8));
})();

const COLORS = ["#ff4f8b", "#ffd166", "#ff8fbf", "#c77dff", "#7ae1ff", "#fff", "#ff5c5c"];
let pieces = [];
let running = false;

function sizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeCanvas();
window.addEventListener("resize", sizeCanvas);

function burst(count) {
  const originY = window.innerHeight * 0.42;
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 4 + Math.random() * 11;
    pieces.push({
      x: window.innerWidth / 2,
      y: originY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      size: 5 + Math.random() * 8,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      rot: Math.random() * Math.PI,
      spin: (Math.random() - 0.5) * 0.3,
      life: 1,
      decay: 0.006 + Math.random() * 0.008,
    });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}

function tick() {
  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  pieces = pieces.filter((p) => p.life > 0 && p.y < window.innerHeight + 60);

  for (const p of pieces) {
    p.vy += 0.22;
    p.vx *= 0.99;
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.spin;
    p.life -= p.decay;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(p.life, 0);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
    ctx.restore();
  }

  if (pieces.length) {
    requestAnimationFrame(tick);
  } else {
    running = false;
    ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  }
}
</script>
</body>
</html>
